  Here are 3 specific "Wrong vs. Correct" examples covering different backend paradigms.
  Example 1: The "Hallucinated Import" Trap (Python / FastAPI)
  Task: Build a user API that saves to a database.
  ❌ The WRONG Way (Parallel Execution)
  Attempting to build the API endpoint and the Database Model at the same time.
  ```json
  {
    "batches": [
      [
        { "id": "models", "description": "Create User SQLAlchemy model" },
        { "id": "api", "description": "Create FastAPI route that imports User and saves data" }
      ]
    ]
  }
  ```
  💀 Why this fails:
  The AI writing api creates code like user = User(name="John", email="...").
  The AI writing models creates code like class User(Base): name = Column(String).
  The Bug: The api might assume there is an id field or a set_password() method that the models file simply didn't create. When you run the code: AttributeError: 'User' object has no attribute 'set_password'.
  ✅ The CORRECT Way (Sequential Context)
  Define the shape of the data first. Then build the logic that uses it.
  ```json
  {
    "batches": [
      [ { "id": "db_setup", "description": "Create database.py with Base and Session", "path": "/models" } ],
      [ { "id": "models", "description": "Create User model inheriting from Base", "path": "/models" } ],
      [ { "id": "api", "description": "Create FastAPI route using User model", "path": "/api" } ]
    ]
  }
  ```
  
  Example 2: The "Supervisor Blindness" (Elixir / OTP)
  Task: Create a background job system with a Supervisor.
  ❌ The WRONG Way (Top-Down)
  Building the Manager (Supervisor) before the Workers.
  ```json
  {
    "batches": [
      [
        { "id": "supervisor", "description": "Create JobSupervisor that starts the JobWorker" },
        { "id": "worker", "description": "Create JobWorker GenServer" }
      ]
    ]
  }
  WRONG- {
  submit_plan({"batches": [[{"id": "mix_config", "description": "Create the Elixir project configuration (mix.exs) defining dependencies.", "output_slot": "Config", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/mix.exs"},{"description": "Define the initial application configuration files.", "id": "app_config", "output_slot": "Config", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/config/config.exs"}], [{"description": "Implement the main Ecto Repository Module.", "id": "repo_module", "output_slot": "Repo", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/lib/procoder/repo.ex"},{"description": "Define the Ecto Schema for storing persistent Agent Session state.", "id": "schema_session", "output_slot": "Schema", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/lib/procoder/schema/session.ex"},{"description": "Define the Ecto Schema for the persistent Task DAG Node.", "id": "schema_task", "output_slot": "Schema", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/lib/procoder/schema/task.ex"},{"description": "Define the Ecto Schema for the CodeGraph Node.", "id": "schema_codegraph", "output_slot": "Schema", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/lib/procoder/schema/codegraph.ex"},{"description": "Define the core Elixir Structs for in-memory state.", "id": "memory_structs", "output_slot": "Structs", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/lib/procoder/core/structs.ex"}], [{"description": "Implement the ConnectionPool GenServer.", "id": "http_pool", "output_slot": "Service", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/lib/procoder/workers/connection_pool.ex"},{"description": "Implement the RateLimiter GenServer.", "id": "rate_limiter", "output_slot": "Service", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/lib/procoder/workers/rate_limiter.ex"},{"description": "Implement the ContextStore Module.", "id": "ets_context_store", "output_slot": "Service", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/lib/procoder/workers/context_store.ex"},{"description": "Implement the PortManager GenServer.", "id": "port_manager", "output_slot": "Service", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/lib/procoder/workers/port_manager.ex"},{"description": "Implement the PromptEngine Module.", "id": "prompt_engine", "output_slot": "Service", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/lib/procoder/core/prompt_engine.ex"},{"description": "Implement the PolicyEngine Module.", "id": "policy_engine", "output_slot": "Service", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/lib/procoder/core/policy_engine.ex"}], [{"description": "Implement the Planner Module.", "id": "planner_engine", "output_slot": "Module", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/lib/procoder/core/planner.ex"},{"description": "Implement the CodeGraph Engine.", "id": "codegraph_engine", "output_slot": "Engine", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/lib/procoder/core/codegraph.ex"},{"description": "Implement the SearchCoordinator Module.", "id": "search_coordinator", "output_slot": "Module", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/lib/procoder/core/search_coordinator.ex"},{"description": "Implement the core Agent GenServer.", "id": "agent_fsm", "output_slot": "Agent", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/lib/procoder/agent.ex"},{"description": "Implement the Rewind Module.", "id": "rewind_capability", "output_slot": "Module", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/lib/procoder/core/rewind.ex"}], [{"description": "Implement the SessionManager DynamicSupervisor.", "id": "session_manager", "output_slot": "Supervisor", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/lib/procoder/session_manager.ex"},{"description": "Implement the CommandRouter Module.", "id": "command_router", "output_slot": "Module", "path": "/home/gifted/acn/tmp/acn_workspaces/procoder/lib/procoder/ui/command_router.ex"},{"description": "Imp