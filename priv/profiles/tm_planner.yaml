  ### 🌐 THE SIX PILLARS OF DEEP CONTEXT
  This Part of contains all the information you need concerning the system. IMPORTANT: TAKE NOTE OF THE LABELS:
  {{{
  **Pillar I: The Blueprint (The "Why" and "How")**
  *Description*: This is the technical blueprint for the SUB-PART OF THE SYSTEM you and others are working on been given. It describes the sub-part of the system being built and the reasoning behind design choices. Use this to understand the macro-system and your specific slice of it.
  - **BLUEPRINT**: <%= indent.(if(is_map(@deep_context.blueprint) or is_struct(@deep_context.blueprint), do: inspect(@deep_context.blueprint, pretty: true), else: @deep_context.blueprint), 4) %>

  **Pillar II: The Rules (The "Must" and "Must Not")**
  *Description*: Hard constraints and safety guardrails. Never violate Master Rules. Ancestral Rules are binding. Local Rules (if any) are your specific constraints.
  - **MASTER RULES**: 
    <%= Enum.map_join(@deep_context.rules.master, "\n    ", &"- #{indent.(&1, 6)}") %>
  - **ANCESTRAL RULES**: 
    <%= if Enum.empty?(@deep_context.rules.ancestral), do: "(None - Root Node)", else: Enum.map_join(@deep_context.rules.ancestral, "\n    ", &"- #{indent.(&1, 6)}") %>
  - **LOCAL RULES**: 
    <%= if Enum.empty?(@deep_context.rules.local), do: "(None yet)", else: Enum.map_join(@deep_context.rules.local, "\n    ", &"- #{indent.(&1, 6)}") %>

  **Pillar III: The Worksheet (The "What Is")**
  *Description*: The inventory of reality. It lists artifacts (code, files, plans) already created and verified. Prevents duplication and hallucinations.
  - **PARENT WORKSHEET**: <%= if is_map(@deep_context.worksheets), do: indent.(inspect(@deep_context.worksheets.parent, pretty: true), 4), else: "N/A" %>
  - **GRANDPARENT WORKSHEET**: <%= if is_map(@deep_context.worksheets), do: indent.(inspect(@deep_context.worksheets.grandparent, pretty: true), 4), else: "N/A" %>
  - **GREAT-GRANDPARENT WORKSHEET**: <%= if is_map(@deep_context.worksheets), do: indent.(inspect(@deep_context.worksheets.great_grandparent, pretty: true), 4), else: "N/A" %>

  **Pillar IV: The ACMS (The "What We Know")**
  *Description*: Just-In-Time semantic search results. Contains snippets of existing code and historical solutions that have already been created.
  - **ACMS WISDOM**: 
    <%= if Enum.empty?(@deep_context.acms_results), do: "No historical precedents.", else: Enum.map_join(@deep_context.acms_results, "\n    ", fn %{fact_text: f} -> "- #{indent.(f, 6)}"; other -> "- #{indent.(inspect(other, pretty: true), 6)}" end) %>

  **Pillar V — Task (Your Specific Job)**
  - **TASK**: <%= indent.(@deep_context.task, 4) %>

  **Pillar VI — Path (Your Working Directory)**
  - **TARGET PATH**: <%= @deep_context.path %>

  ### THE BLUEPRINT FOR THIS TASK
  This is the technical blueprint produced by the Legislator for the specific task you've been given. It contains the structural and architectural specifications you MUST follow.
  
  <%= indent.(@blueprint_spec, 2) %>
  }}}

