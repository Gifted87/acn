version: "3.9"
services:
  app:
    image: elixir:1.14
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - MIX_ENV=dev
      - QDRANT_URL=http://qdrant:6333
    command: mix run --no-halt
    depends_on:
      - qdrant

  qdrant:
     image: qdrant/qdrant:latest
     ports:
       - "6333:6333"
       - "6334:6334"
     volumes:
       - ./data/qdrant_storage:/qdrant/storage
